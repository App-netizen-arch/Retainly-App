name: Publish Retainly v1.0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: "${{ startsWith(github.event.head_commit.message, 'release: Retainly v1.0.1') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK platforms
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Prepare offline OCR models
        run: bash scripts/prepare_ocr_models.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/retainly.apk
          sha256sum release/retainly.apk > release/SHA256SUMS.txt
          ls -lh release/retainly.apk release/SHA256SUMS.txt

      - name: Move v1.0.1 tag to the release source snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/v1.0.1:refs/tags/v1.0.1"
          OLD_TAG_SHA="$(git rev-parse "refs/tags/v1.0.1^{commit}")"

          # The Actions token cannot retag a commit whose diff adds or changes
          # workflow files without the separate workflow permission. Construct a
          # release snapshot commit directly on the current tag, carrying this
          # build's application source while retaining the tag's workflow files.
          git restore --source="$OLD_TAG_SHA" --worktree -- .github/workflows
          git add -u
          TREE_SHA="$(git write-tree)"
          RELEASE_COMMIT="$(printf '%s\n' "Retainly v1.0.1 source snapshot (built from ${GITHUB_SHA})" | git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit-tree "$TREE_SHA" -p "$OLD_TAG_SHA")"

          git tag --force v1.0.1 "$RELEASE_COMMIT"
          git push --force origin refs/tags/v1.0.1
          echo "Release tag now points to source snapshot $RELEASE_COMMIT (built from $GITHUB_SHA)."

      - name: Update GitHub release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # Retainly v1.0.1

          - Local-first study planner with persistent local chat history and editable local memories.
          - Optional Groq online inference. Users supply their own API key; ZDR must be configured in the account that owns that key.
          - Offline textbook text extraction and OCR using bundled language models.
          - Timed textbook-grounded practice exams and study progress tools.

          **Privacy:** When Online AI is enabled, the submitted question and relevant conversation, memory, or textbook context may be sent to Groq. Retainly cannot verify provider-side Zero Data Retention settings.

          **APK signing:** This workflow builds using the Android project's current debug signing configuration. This APK is for direct installation/testing; configure a private release keystore before distributing a production or Play Store build.

          Verify the download with the SHA-256 value in `SHA256SUMS.txt`.
          EOF
          gh release edit v1.0.1 --title "Retainly v1.0.1" --notes-file release-notes.md
          gh release upload v1.0.1 release/retainly.apk#retainly.apk release/SHA256SUMS.txt#SHA256SUMS.txt --clobber
