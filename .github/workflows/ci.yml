name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./retainly
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        working-directory: ./retainly
      - name: Analyze code
        run: flutter analyze
        working-directory: ./retainly
      - name: Run tests
        run: flutter test
        working-directory: ./retainly

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./retainly
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        working-directory: ./retainly
      - name: Analyze code
        run: flutter analyze
        working-directory: ./retainly
      - name: Setup keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > android/app/keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "storeFile=keystore.jks" >> android/keystore.properties
        working-directory: ./retainly
      - name: Build Android App Bundle
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release
        working-directory: ./retainly
      - name: Build Android APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug
        working-directory: ./retainly
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: retainly/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: retainly/build/app/outputs/flutter-apk/app-debug.apk

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./retainly
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        working-directory: ./retainly
      - name: Analyze code
        run: flutter analyze
        working-directory: ./retainly
      - name: Build Linux
        run: flutter build linux --release
        working-directory: ./retainly
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle/
