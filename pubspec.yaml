name: retainly
description: "Retainly — Android-first study planner for Pakistani Matric students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  meta: ^1.18.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.1.2
  flutter_pdfview: ^1.3.2
  intl: ^0.20.2
  permission_handler: ^12.0.3
  shared_preferences: ^2.2.2
  sqflite_common_ffi: ^2.3.0
  http: ^1.2.0
  encrypt: ^5.0.1
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.1
  flutter_markdown: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.31.0

flutter:
  generate: true
  uses-material-design: true
